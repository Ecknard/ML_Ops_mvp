name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Tests (unitaires + bout-en-bout sur données synthétiques)
        run: PYTHONPATH=src pytest -q

  smoke-train:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Cycle complet sur le vrai dataset UCI
        run: |
          make data validate train promote evaluate export
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image de service
        run: docker build -t adult-income-api .

  # --- Publication sur Hugging Face : uniquement sur un tag vX.Y.Z ---
  # Nécessite le secret HF_TOKEN et les variables HF_MODEL_REPO / HF_SPACE_REPO
  # configurés dans les settings du repo GitHub (Settings > Secrets and variables).
  deploy-huggingface:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, smoke-train]
    environment: huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Reconstituer le champion (registre non partagé entre jobs)
        run: make data validate train promote export
      - name: Export ONNX (validé contre scikit-learn)
        run: make export-onnx
      - name: Publier le modèle sur le Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make publish-model HF_MODEL_REPO=${{ vars.HF_MODEL_REPO }}
      - name: Déployer le Space statique
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make deploy-space HF_MODEL_REPO=${{ vars.HF_MODEL_REPO }} HF_SPACE_REPO=${{ vars.HF_SPACE_REPO }}
